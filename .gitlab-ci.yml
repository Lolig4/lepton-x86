spec:
  inputs:
    ROOTFS_VERSION:
      description: "Branch/tag to download rootfs build artifacts from. Empty = run build-rootfs-job, 'latest' = resolve to most recent successful build."
      default: "latest"
    ROOTFS14_VERSION:
      description: "Branch/tag to download android 14 rootfs build artifacts from. Empty = run build-rootfs-14-job, 'latest' = resolve to most recent successful build."
      default: "latest"

---

workflow:
  rules:
    # Avoid duplicate branch pipelines when a merge request is open.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: always
      variables:
        ROOTFS_VERSION: $[[ inputs.ROOTFS_VERSION ]]
        ROOTFS14_VERSION: $[[ inputs.ROOTFS14_VERSION ]]

build-compat-tool-job:
  stage: build
  image: ubuntu:24.04
  script:
    - ./.ci_scripts/install-build-compat_tool-dependencies.sh
    - ./.ci_scripts/build-compat_tool.sh
  variables:
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"
  artifacts:
    paths:
      - compat_tool.tar.zst

build-rootfs-job:
  stage: build
  image: ubuntu:22.04
  script:
    - |
      apt-get -qq update && \
            apt-get install -y git python3 curl unzip tmux
      if [[ -n "${CI_COMMIT_TAG:-}" ]] || [[ "${CI_PIPELINE_SOURCE:-}" == "merge_request_event" ]] || [[ "${CI_COMMIT_BRANCH:-}" == "main" ]]; then
        # Ensure tags are available for comparison in CI environments with shallow clones
        git fetch --tags --force --prune origin >/dev/null 2>&1 || true
        # Find the previous version tag without needing the first parent object
        if [[ "${CI_PIPELINE_SOURCE:-}" == "merge_request_event" ]] || [[ "${CI_COMMIT_BRANCH:-}" == "main" ]]; then
            PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
        else
            PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '/^'"$CI_COMMIT_TAG"'$/{n;p;q}' || true)
        fi
        echo "build-rootfs: CI_COMMIT_TAG=${CI_COMMIT_TAG:-}, CI_COMMIT_SHA=${CI_COMMIT_SHA}, CI_COMMIT_BRANCH=${CI_COMMIT_BRANCH:-}, PREVIOUS_TAG=$PREVIOUS_TAG, initial ROOTFS_VERSION=${ROOTFS_VERSION:-}"
        if [ -z "$PREVIOUS_TAG" ]; then
          # If there was no previous tag, it's an error.
          echo "build-rootfs: no previous tag found, forcing rebuild"
          ROOTFS_VERSION=""
        elif ! git diff --quiet "$PREVIOUS_TAG" "${CI_COMMIT_SHA}" -- image .ci_scripts/build-rootfs.sh .ci_scripts/install-build-rootfs-dependencies.sh; then
          # Rootfs changed since the previous tag: rebuild.
          echo "build-rootfs: rootfs changed vs $PREVIOUS_TAG, forcing rebuild"
          ROOTFS_VERSION=""
        else
          # No rootfs changes since the previous tag: keep existing ROOTFS_VERSION.
          echo "build-rootfs: no rootfs changes vs $PREVIOUS_TAG, keeping ROOTFS_VERSION=$ROOTFS_VERSION"
        fi
      fi
      if [[ -z "${ROOTFS_VERSION}" ]]; then
        # for repo:
        sed -i "s|https://gitlab.steamos.cloud/|https://${BUILD_TOKEN_USER}:${BUILD_TOKEN_PASSWORD}@gitlab.steamos.cloud/|g" image/android_vendor_valve/manifest_scripts/manifests-30/10-valve-remotes.xml
        ./.ci_scripts/install-build-rootfs-dependencies.sh
        ./.ci_scripts/build-rootfs.sh
      else
        ROOTFS_JOB_ID=$(python3 ./.ci_scripts/resolve-rootfs-version.py build-rootfs-job "$ROOTFS_VERSION")
        DOWNLOAD_URL="${CI_API_V4_URL}/projects/deckard%2Flepton/jobs/${ROOTFS_JOB_ID}/artifacts"
        echo "Downloading rootfs artifacts from: $DOWNLOAD_URL (ROOTFS_VERSION=$ROOTFS_VERSION)"
        curl --fail --location --header "PRIVATE-TOKEN: ${CI_LEPTON_TOKEN}" \
          --output build-rootfs-artifacts.zip \
          "$DOWNLOAD_URL"
        unzip -o build-rootfs-artifacts.zip
        rm build-rootfs-artifacts.zip
      fi
      test -f image/system.img || exit 1
      test -f image/vendor.img || exit 1
      test -f image/NOTICE.txt || exit 1
      test -f image/version.txt || exit 1
      test -f symbols.tar.zst || exit 1
  artifacts:
    paths:
      - image/system.img
      - image/vendor.img
      - image/NOTICE.txt
      - image/version.txt
      - image/output/out/verbose.log.gz
      - symbols.tar.zst
    when: always
  tags:
    - x86_64-linux-kvm-docker-largedisk
  timeout: 8 hours

prepare-rootfs-job:
  stage: build
  image: ubuntu:24.04
  needs:
    - job: build-rootfs-job
  script:
    - set -euo pipefail
    # comment out to debug: SSH in via GCP, go down the container and attach to the session (with `tmux attach -t debug`)
#    - apt-get -qq update && apt-get install -y tmux
#    - echo "Internal IP (use to find the right VM in GCP):" && hostname -I
#    - tmux new-session -d -s debug
#    - while tmux has-session -t debug 2>/dev/null; do sleep 1; done
    - |
      test -f image/system.img || exit 1
      test -f image/vendor.img || exit 1
      test -f image/NOTICE.txt || exit 1
      test -f image/version.txt || exit 1
    - ./.ci_scripts/install-prepare-rootfs-dependencies.sh
    - ./.ci_scripts/prepare-rootfs.sh
      test -f rootfs.tar.zst || exit 1
  artifacts:
    paths:
      - rootfs.tar.zst

