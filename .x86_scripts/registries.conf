# Fedora ships short-name-mode = "enforcing", which makes podman refuse to
# resolve the locally built "lepton-builder:latest" when no TTY is available
# to prompt.  container.sh (upstream) uses that short name, so point podman at
# this copy instead of patching upstream's script.
unqualified-search-registries = ["registry.fedoraproject.org", "registry.access.redhat.com", "docker.io"]
short-name-mode = "permissive"
